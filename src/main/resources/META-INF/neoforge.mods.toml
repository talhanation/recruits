modLoader="javafml"

loaderVersion="${loader_version_range}"

license="${mod_license}"

[[mods]]

modId="${mod_id}"

version="${mod_version}"

displayName="${mod_name}"
updateJSONURL="https://raw.githubusercontent.com/talhanation/recruits/main/update.json"
displayURL="https://modrinth.com/mod/villager-recruits/versions"

logoFile="logo.png"

credits="talhanation, messire, kaiserroman"
authors="${mod_authors}"

description='''${mod_description}'''

[[mixins]]
config="mixins.recruits.json"

[[accessTransformers]]
file="META-INF/accesstransformer.cfg"

[[dependencies."${mod_id}"]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies."${mod_id}"]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
